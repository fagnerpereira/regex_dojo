<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The page you were looking for doesn’t exist (404)</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        max-width: 100vw;
        overflow-x: hidden;
        font-size: 100%;
      }

      body {
        color: #211b3a;
        background: #f4f0fb;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 0 4vw;
      }

      .card {
        display: flex;
        gap: 1rem;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 420px;
        padding: 44px 36px;
        background: #ffffff;
        border: 1px solid #efeaf9;
        border-radius: 26px;
        box-shadow: 0 2px 4px rgba(60, 30, 120, 0.05), 0 14px 40px rgba(60, 30, 120, 0.07);
      }

      .code {
        font-size: 3rem;
        font-weight: 800;
        color: #7c3aed;
      }

      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        color: #211b3a;
      }

      p {
        line-height: 1.6;
        color: #6b6488;
        font-size: 0.9375rem;
      }

      a.home-link {
        margin-top: 0.5rem;
        display: inline-block;
        padding: 0.625rem 1.5rem;
        background: #7c3aed;
        color: #ffffff;
        font-weight: 700;
        font-size: 0.875rem;
        text-decoration: none;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(124, 58, 237, 0.3);
      }
    </style>
  </head>

  <body>
    <!-- This file lives in public/404.html -->
    <main>
      <div class="card">
        <div class="code">404</div>
        <h1>Kata not found</h1>
        <p>The page you were looking for doesn’t exist.</p>
        <a class="home-link" href="/">← Back to the dojo</a>
      </div>
    </main>
  </body>
</html>
